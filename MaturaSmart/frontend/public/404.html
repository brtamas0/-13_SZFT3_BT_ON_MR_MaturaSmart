<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Hoppá! | MaturaSmart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../src/assets/main.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { darkBg: '#0f172a' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-[#020617] text-slate-800 dark:text-white min-h-screen flex items-center justify-center overflow-hidden relative transition-colors duration-300">

    <div class="grid-bg"></div>

    <button id="theme-toggle" class="absolute top-5 right-5 w-10 h-10 rounded-full border border-gray-300 dark:border-white/20 bg-white/50 dark:bg-white/5 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-white/10 transition z-50 shadow-sm">
        <span class="text-xl">🌓</span>
    </button>

    <div class="relative z-10 text-center p-8 max-w-2xl w-full">
        
        <div class="text-gradient-404 mb-4">
            404
        </div>
        
        <div class="flex justify-center mb-6">
            <img src="axel404.png" 
                 class="axel-dead-animation" 
                 alt="K.O. Axel"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <div class="text-6xl hidden animate-pulse">🦎💀</div>
        </div>
        
        <h1 class="text-3xl md:text-4xl font-bold mb-4 text-slate-900 dark:text-white transition-colors">
            Itt még a puskák se segítenek...
        </h1>
        
        <p class="text-slate-600 dark:text-gray-400 mb-10 text-lg leading-relaxed max-w-md mx-auto transition-colors">
            Ez az oldal úgy eltűnt, mint a motiváció hétfő reggel. <br>
            Vagy lehet, hogy Axel megette a házival együtt. 🦎😢
        </p>

        <a href="../index.html" class="btn-shadow-404 inline-flex items-center gap-2 px-8 py-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg">
            <span>🏃</span> Menekülés a főoldalra
        </a>

    </div>

    <footer class="absolute bottom-4 text-center text-sm text-slate-500 dark:text-gray-600 z-10 w-full">
        MaturaSmart • Hiba történt a mátrixban
    </footer>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        
        htmlElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') htmlElement.classList.add('dark');

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            if (newTheme === 'dark') htmlElement.classList.add('dark');
            else htmlElement.classList.remove('dark');
        });
    </script>
</body>
</html>
