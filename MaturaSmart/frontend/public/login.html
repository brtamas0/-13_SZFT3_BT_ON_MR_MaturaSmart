<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaturaSmart – Belépés</title>
</head>
<body class="min-h-screen bg-[#020617] flex items-center justify-center text-white">
   <div class="relative w-full max-w-4xl bg-[#020617]">
        <div class="grid md:grid-cols-2 rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
            <div class="bg-gradient-to-br from-[#0f172a] via-[#1e1b4b] to-[#312e81] p-10 relative">
                <div class="absolute top-8 left-8 bg-white text-black text-sm px-4 py-2 rounded-xl shadow">
                    Szia! 👋 Én vagyok Axel.<br />
                    Lépj be, és pörgessük fel az agyad! 🚀
                </div>
                <div class="mt-48">
                    <p class="text-white text-4xl font-extrabold leading-tight">Matura</span><span class="text-indigo-400 text-4xl font-extrabold leading-tight">Smart</p>
                    <h2 class="text-2xl font-bold">Tanulj okosabban,<br />ne keményebben.</h2>
                    <p class="text-sm text-gray-300 mt-4 max-w-xs">Axel már készen áll, mire vársz?</p>
                </div>
            </div>
            <div class="bg-[#020617] p-10 flex flex-col justify-center items-center">
                <div class="text-4xl mb-4">🚀</div>
                <h2 class="text-2xl font-bold mb-2">Kezdjük el!</h2>
                <p class="text-gray-400 mb-6 text-sm">Jelentkezz be az iskolai fiókoddal</p>
                <button class="flex items-center gap-3 px-6 py-3 bg-white text-black rounded-xl font-medium hover:bg-gray-200 transition shadow">
                    <span class="text-xl">G</span>
                    Belépés Google fiókkal
                </button>

                <p class="text-xs text-gray-500 mt-6 text-center">
                    A MaturaSmart 2025-ös vizsgakövetelményekre épül.
                </p>
            </div>
        </div>
   </div>
<script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
